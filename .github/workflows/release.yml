name: release

# Build cross-platform binaries and attach them to a GitHub Release whenever a
# version tag is pushed:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C "target/${{ matrix.target }}/release" -czf \
            "pow-${{ matrix.target }}.tar.gz" pow

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a "pow-${{ matrix.target }}.zip" \
            "./target/${{ matrix.target }}/release/pow.exe"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pow-${{ matrix.target }}.tar.gz
            pow-${{ matrix.target }}.zip
          fail_on_unmatched_files: false
