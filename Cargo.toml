[package]
name = "pow"
version = "0.1.0"
edition = "2021"
description = "POW — PHP One-click Workspace. XAMPP, but ultra-minimal."

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
indicatif = "0.17"
anyhow = "1"
futures-util = "0.3"
dirs = "5"

# Keep the release binary as small as possible.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
